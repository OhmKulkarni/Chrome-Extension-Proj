<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headers Test</title>
</head>
<body>
    <h1>Network Headers Test</h1>
    <p>This page tests if request/response headers are being captured correctly.</p>
    
    <button onclick="testFetchWithHeaders()">Test Fetch with Headers</button>
    <button onclick="testXHRWithHeaders()">Test XHR with Headers</button>
    <button onclick="testJSONRequest()">Test JSON Request</button>
    
    <div id="results"></div>

    <script>
        function log(message) {
            document.getElementById('results').innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }

        async function testFetchWithHeaders() {
            log('=== Testing Fetch with Custom Headers ===');
            
            try {
                const response = await fetch('https://httpbin.org/headers', {
                    method: 'GET',
                    headers: {
                        'X-Custom-Header': 'TestValue123',
                        'User-Agent': 'HeaderTestExtension/1.0',
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.text();
                log('✅ Fetch request completed. Check extension dashboard for headers.');
                log('Response headers should include: ' + Array.from(response.headers.keys()).join(', '));
                
            } catch (error) {
                log('❌ Fetch request failed: ' + error.message);
            }
        }
        
        function testXHRWithHeaders() {
            log('=== Testing XHR with Custom Headers ===');
            
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://httpbin.org/post');
            
            // Set custom request headers
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('X-Test-Header', 'XHRTestValue456');
            xhr.setRequestHeader('Authorization', 'Bearer test-token-123');
            
            xhr.onloadend = function() {
                log('✅ XHR request completed. Status: ' + xhr.status);
                log('Check extension dashboard for request and response headers.');
                log('Response headers: ' + xhr.getAllResponseHeaders());
            };
            
            xhr.onerror = function() {
                log('❌ XHR request failed');
            };
            
            // Send JSON data
            const jsonData = JSON.stringify({
                test: 'data',
                timestamp: new Date().toISOString()
            });
            
            xhr.send(jsonData);
        }
        
        async function testJSONRequest() {
            log('=== Testing JSON API Request ===');
            
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/1', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': 'test-api-key-789',
                        'X-Client-Version': '2.0.0'
                    },
                    body: JSON.stringify({
                        id: 1,
                        title: 'Updated Title',
                        body: 'Updated body content',
                        userId: 1
                    })
                });
                
                const data = await response.json();
                log('✅ JSON API request completed. Status: ' + response.status);
                log('Check extension dashboard for complete header information.');
                
            } catch (error) {
                log('❌ JSON API request failed: ' + error.message);
            }
        }
        
        // Auto-run one test
        setTimeout(() => {
            log('Page loaded. Click buttons to test header capture or wait for auto-test...');
            setTimeout(testFetchWithHeaders, 2000);
        }, 1000);
        
    </script>
</body>
</html>
