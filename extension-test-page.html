<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Test Page</title>
</head>
<body>
    <h1>Chrome Extension Test Page</h1>

    <div style="padding: 20px; background: #f0f0f0; margin: 20px 0;">
        <h2>Test Actions:</h2>
        <button id="testNetwork">Make Test Network Request</button>
        <button id="testError">Generate Console Error</button>
        <button id="testDashboard">Open Dashboard</button>
    </div>

    <div id="output" style="padding: 20px; background: #fff; border: 1px solid #ccc; margin: 20px 0;">
        <h3>Test Output:</h3>
        <div id="results"></div>
    </div>

    <script>
        const output = document.getElementById('results');

        function log(message) {
            const div = document.createElement('div');
            div.style.margin = '5px 0';
            div.style.padding = '5px';
            div.style.background = '#e8f5e8';
            div.style.border = '1px solid #4caf50';
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(div);
        }

        document.getElementById('testNetwork').onclick = async () => {
            try {
                log('Making test network request...');
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
                const data = await response.json();
                log(`Network request successful: ${data.title}`);
            } catch (error) {
                log(`Network request failed: ${error.message}`);
            }
        };

        document.getElementById('testError').onclick = () => {
            log('Generating console error...');
            console.error('This is a test error from the test page');
            throw new Error('Test error for extension capture');
        };

        document.getElementById('testDashboard').onclick = () => {
            log('Attempting to open dashboard...');
            // This should trigger the extension if it's working
            if (chrome && chrome.runtime) {
                chrome.runtime.sendMessage({action: 'OPEN_DASHBOARD'});
            } else {
                log('Chrome extension API not available');
            }
        };

        // Log page load
        log('Test page loaded successfully');

        // Test if extension is injected
        if (window._extensionInjected) {
            log('✅ Extension appears to be injected and active');
        } else {
            log('⚠️ Extension injection not detected');
        }
    </script>
</body>
</html>
