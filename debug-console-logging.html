<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Logging Test</title>
</head>
<body>
    <h1>Console Logging Test</h1>
    <p>Check Console for debugging info</p>
    <button onclick="testConsoleAndSettings()">Test Console & Settings</button>
    <button onclick="debugStorage()">Debug Storage</button>

    <script>
        function testConsoleAndSettings() {
            console.log("=== Testing Console Logging ===");
            
            // Test direct console calls
            console.error("Test ERROR message");
            console.warn("Test WARN message");
            console.info("Test INFO message");
            console.log("Test LOG message");
            
            // Check if main-world script is loaded
            console.log("Main world script loaded:", typeof window.__isInterceptingConsole !== 'undefined');
            
            // Test with delay to see if settings load
            setTimeout(() => {
                console.error("Delayed ERROR message (after settings should load)");
            }, 2000);
        }
        
        function debugStorage() {
            // This will help us see what's in storage
            window.dispatchEvent(new CustomEvent('contentScriptRequest', {
                detail: { 
                    action: 'debugStorage', 
                    data: {}, 
                    requestId: 'debug-123'
                }
            }));
        }
        
        // Auto-test after page load
        setTimeout(testConsoleAndSettings, 1000);
    </script>
</body>
</html>
