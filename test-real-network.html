<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Network Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 15px; margin: 10px; background: #007cba; color: white; border: none; cursor: pointer; }
        button:hover { background: #005a8b; }
        .output { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        .log { font-family: monospace; font-size: 12px; color: #333; }
    </style>
</head>
<body>
    <h1>🌐 Real Network Request Test</h1>
    <p>This page makes actual network requests to test if your extension captures real traffic (not just test requests).</p>

    <div>
        <button onclick="makeGitHubRequest()">📡 Fetch GitHub API</button>
        <button onclick="makeHttpbinRequest()">🔄 Fetch HTTPBin</button>
        <button onclick="makeXHRRequest()">📨 XHR Request</button>
        <button onclick="makePostRequest()">📤 POST Request</button>
        <button onclick="clearOutput()">🧹 Clear</button>
    </div>

    <div class="output" id="output">
        <div class="log">Ready for network requests... Check your extension dashboard!</div>
    </div>

    <script>
        function log(message) {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'log';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        async function makeGitHubRequest() {
            log('🚀 Making GitHub API request...');
            try {
                const response = await fetch('https://api.github.com/users/github');
                const data = await response.json();
                log(`✅ GitHub API Response: ${response.status} - User: ${data.login} (${data.public_repos} repos)`);
            } catch (error) {
                log(`❌ GitHub API Error: ${error.message}`);
            }
        }

        async function makeHttpbinRequest() {
            log('🚀 Making HTTPBin request...');
            try {
                const response = await fetch('https://httpbin.org/json');
                const data = await response.json();
                log(`✅ HTTPBin Response: ${response.status} - ${JSON.stringify(data).substring(0, 100)}...`);
            } catch (error) {
                log(`❌ HTTPBin Error: ${error.message}`);
            }
        }

        async function makeXHRRequest() {
            log('🚀 Making XMLHttpRequest...');
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.github.com/repos/microsoft/vscode');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        log(`✅ XHR Response: ${xhr.status} - Repo: ${data.full_name} (${data.stargazers_count} stars)`);
                    } else {
                        log(`❌ XHR Error: ${xhr.status}`);
                    }
                }
            };
            xhr.send();
        }

        async function makePostRequest() {
            log('🚀 Making POST request...');
            try {
                const response = await fetch('https://httpbin.org/post', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Test from Chrome Extension',
                        timestamp: Date.now()
                    })
                });
                const data = await response.json();
                log(`✅ POST Response: ${response.status} - Received: ${JSON.stringify(data.json).substring(0, 50)}...`);
            } catch (error) {
                log(`❌ POST Error: ${error.message}`);
            }
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '<div class="log">Output cleared. Ready for new requests...</div>';
        }

        log('🟢 Test page loaded. Extension should capture these real network requests!');
    </script>
</body>
</html>
