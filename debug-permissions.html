<!DOCTYPE html>
<html>
<head>
    <title>Debug Permissions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .state { background: #f0f8f0; }
        .actions { background: #f8f0f0; }
        button { margin: 5px; padding: 10px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        .domain { font-weight: bold; color: #0066cc; }
    </style>
</head>
<body>
    <h1>Permission System Debug</h1>

    <div class="section state">
        <h2>Current State</h2>
        <div id="current-tab">Loading tab info...</div>
        <pre id="permission-state">Loading permissions...</pre>
    </div>

    <div class="section actions">
        <h2>Actions</h2>
        <button onclick="refreshState()">🔄 Refresh State</button>
        <button onclick="resetSite()">🚫 Disable Site</button>
        <button onclick="enableSite()">✅ Enable Site</button>
        <button onclick="clearAllSitePermissions()">🧹 Clear All Site Permissions</button>
        <button onclick="resetToDefaults()">🔄 Reset to Defaults</button>
    </div>

    <div class="section">
        <h2>Permission Log</h2>
        <pre id="log"></pre>
    </div>

    <script>
        let currentTab = null;

        function log(message) {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }

        async function getCurrentTab() {
            const tabs = await chrome.tabs.query({ active: true, currentWindow: true });
            return tabs[0];
        }

        async function refreshState() {
            try {
                log('🔄 Refreshing permission state...');

                currentTab = await getCurrentTab();
                if (!currentTab?.url) {
                    log('❌ No current tab found');
                    return;
                }

                const url = new URL(currentTab.url);
                const domain = url.hostname;

                document.getElementById('current-tab').innerHTML = `
                    <strong>Tab:</strong> ${currentTab.id}<br>
                    <strong>URL:</strong> ${currentTab.url}<br>
                    <strong>Domain:</strong> <span class="domain">${domain}</span>
                `;

                // Get the unified permission manager (injected globally by background)
                const response = await chrome.runtime.sendMessage({
                    action: 'debugGetPermissionState',
                    tabId: currentTab.id,
                    domain: domain
                });

                if (response?.success) {
                    document.getElementById('permission-state').textContent = JSON.stringify(response.state, null, 2);
                    log(`✅ Permission state loaded for ${domain}`);
                } else {
                    log(`❌ Failed to get permission state: ${response?.error || 'Unknown error'}`);
                }

            } catch (error) {
                log(`❌ Error refreshing state: ${error.message}`);
            }
        }

        async function resetSite() {
            if (!currentTab) return;

            const url = new URL(currentTab.url);
            const domain = url.hostname;

            try {
                log(`🚫 Disabling site: ${domain}`);

                const response = await chrome.runtime.sendMessage({
                    action: 'debugSetSiteEnabled',
                    domain: domain,
                    enabled: false
                });

                if (response?.success) {
                    log(`✅ Site ${domain} disabled`);
                    await refreshState();
                } else {
                    log(`❌ Failed to disable site: ${response?.error || 'Unknown error'}`);
                }

            } catch (error) {
                log(`❌ Error disabling site: ${error.message}`);
            }
        }

        async function enableSite() {
            if (!currentTab) return;

            const url = new URL(currentTab.url);
            const domain = url.hostname;

            try {
                log(`✅ Enabling site: ${domain}`);

                const response = await chrome.runtime.sendMessage({
                    action: 'debugSetSiteEnabled',
                    domain: domain,
                    enabled: true
                });

                if (response?.success) {
                    log(`✅ Site ${domain} enabled`);
                    await refreshState();
                } else {
                    log(`❌ Failed to enable site: ${response?.error || 'Unknown error'}`);
                }

            } catch (error) {
                log(`❌ Error enabling site: ${error.message}`);
            }
        }

        async function clearAllSitePermissions() {
            try {
                log(`🧹 Clearing all site permissions...`);

                const response = await chrome.runtime.sendMessage({
                    action: 'debugClearAllSitePermissions'
                });

                if (response?.success) {
                    log(`✅ All site permissions cleared`);
                    await refreshState();
                } else {
                    log(`❌ Failed to clear permissions: ${response?.error || 'Unknown error'}`);
                }

            } catch (error) {
                log(`❌ Error clearing permissions: ${error.message}`);
            }
        }

        async function resetToDefaults() {
            try {
                log(`🔄 Resetting to defaults...`);

                const response = await chrome.runtime.sendMessage({
                    action: 'debugResetToDefaults'
                });

                if (response?.success) {
                    log(`✅ Reset to defaults completed`);
                    await refreshState();
                } else {
                    log(`❌ Failed to reset: ${response?.error || 'Unknown error'}`);
                }

            } catch (error) {
                log(`❌ Error resetting: ${error.message}`);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Permission debugger loaded');
            refreshState();
        });
    </script>
</body>
</html>
