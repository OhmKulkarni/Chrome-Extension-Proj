<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Enable Extension Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 15px; margin: 10px; background: #007cba; color: white; border: none; cursor: pointer; }
        .log { font-family: monospace; font-size: 12px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>🔧 Force Enable Extension Test</h1>

    <div>
        <button onclick="forceEnableLogging()">🚀 Force Enable Network Logging</button>
        <button onclick="testNetworkRequest()">📡 Test Network Request</button>
        <button onclick="checkMainWorldState()">🔍 Check Main World State</button>
    </div>

    <div id="log"></div>

    <script>
        function log(message) {
            const div = document.createElement('div');
            div.className = 'log';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('log').appendChild(div);
        }

        function forceEnableLogging() {
            log('🔧 Forcing network logging enable...');

            // Dispatch the event that should enable logging
            window.dispatchEvent(new CustomEvent('tabLoggingStateChange', {
                detail: {
                    networkEnabled: true,
                    consoleEnabled: false
                }
            }));

            log('✅ Event dispatched to main world script');
        }

        function checkMainWorldState() {
            log('🔍 Checking main world state...');

            // Check if the main world script is loaded
            if (window._extensionInjected) {
                log('✅ Main world script is injected');

                // Try to check the interception state by monitoring window.fetch
                if (window.fetch.toString().includes('original')) {
                    log('✅ Fetch appears to be intercepted');
                } else {
                    log('⚠️ Fetch may not be intercepted');
                }
            } else {
                log('❌ Main world script not detected');
            }
        }

        async function testNetworkRequest() {
            log('📡 Making test request...');
            try {
                const response = await fetch('https://httpbin.org/json');
                const data = await response.json();
                log(`✅ Request successful: ${response.status}`);
            } catch (error) {
                log(`❌ Request failed: ${error.message}`);
            }
        }

        // Auto-check on page load
        window.addEventListener('load', () => {
            log('🟢 Page loaded');
            checkMainWorldState();
        });
    </script>
</body>
</html>
