<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Size Test</title>
</head>
<body>
    <h1>Quick Size Debug Test</h1>
    <button onclick="testStorage()">Test Storage Data</button>
    <button onclick="makeTestRequest()">Make Test Request</button>
    <div id="results" style="margin-top: 20px; font-family: monospace; white-space: pre-wrap;"></div>

    <script>
        async function testStorage() {
            const results = document.getElementById('results');
            results.textContent = 'Testing stored data...\n';

            try {
                const response = await chrome.runtime.sendMessage({
                    action: 'getNetworkRequests',
                    limit: 5
                });

                if (response && response.success && response.data) {
                    let output = `Found ${response.data.length} requests:\n\n`;

                    response.data.forEach((req, i) => {
                        output += `${i+1}. ${req.method} ${req.url.substring(0, 50)}...\n`;
                        output += `   payload_size: ${req.payload_size} (${typeof req.payload_size})\n`;
                        output += `   request_size: ${req.request_size} (${typeof req.request_size})\n`;
                        output += `   response_size: ${req.response_size} (${typeof req.response_size})\n`;
                        output += `   status: ${req.status}\n`;
                        output += `   timestamp: ${req.timestamp}\n\n`;
                    });

                    results.textContent = output;
                } else {
                    results.textContent = 'No data or error: ' + JSON.stringify(response);
                }
            } catch (error) {
                results.textContent = 'Error: ' + error.message;
            }
        }

        async function makeTestRequest() {
            const results = document.getElementById('results');
            results.textContent = 'Making test request...\n';

            try {
                // Make a test request that should be captured
                const response = await fetch('https://httpbin.org/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ test: 'size calculation', data: 'x'.repeat(1000) })
                });

                const responseText = await response.text();

                results.textContent += `Request made successfully!\n`;
                results.textContent += `Response status: ${response.status}\n`;
                results.textContent += `Response size: ${responseText.length} characters\n\n`;

                // Wait 3 seconds then check if it was stored
                setTimeout(async () => {
                    try {
                        const stored = await chrome.runtime.sendMessage({
                            action: 'getNetworkRequests',
                            limit: 1
                        });

                        if (stored?.success && stored.data?.length > 0) {
                            const latest = stored.data[0];
                            results.textContent += `Latest stored request:\n`;
                            results.textContent += `URL: ${latest.url}\n`;
                            results.textContent += `payload_size: ${latest.payload_size}\n`;
                            results.textContent += `request_size: ${latest.request_size}\n`;
                            results.textContent += `response_size: ${latest.response_size}\n`;
                        } else {
                            results.textContent += `No recent requests found in storage.\n`;
                        }
                    } catch (e) {
                        results.textContent += `Error checking storage: ${e.message}\n`;
                    }
                }, 3000);

            } catch (error) {
                results.textContent += 'Request failed: ' + error.message;
            }
        }
    </script>
</body>
</html>
