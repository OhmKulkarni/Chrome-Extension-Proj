<!DOCTYPE html>
<html>
<head>
    <title>Console Error Test Page</title>
</head>
<body>
    <h1>Console Error Test Page</h1>
    <p>This page will generate console errors for testing the extension.</p>
    
    <button onclick="generateError1()">Generate Error 1</button>
    <button onclick="generateError2()">Generate Error 2</button>
    <button onclick="generateError3()">Generate Error 3</button>
    
    <script>
        function generateError1() {
            console.error('Test Error 1: This is a sample error message');
        }
        
        function generateError2() {
            console.error('Test Error 2: Another error for testing', { 
                code: 'TEST_ERROR', 
                details: 'Additional error details' 
            });
        }
        
        function generateError3() {
            // This will cause a reference error
            nonExistentVariable.someProperty;
        }
        
        // Generate some initial errors on page load
        setTimeout(() => {
            console.error('Initial Error: Page loaded with test error');
        }, 1000);
        
        setTimeout(() => {
            console.error('Delayed Error: This error appeared after 3 seconds');
        }, 3000);
    </script>
</body>
</html>
