<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Debug - Full Diagnosis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .good { background: #d4edda; color: #155724; }
        .bad { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        button { padding: 10px 15px; margin: 5px; background: #007cba; color: white; border: none; cursor: pointer; }
        .log { font-family: monospace; font-size: 12px; margin: 5px 0; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔍 Extension Full Diagnosis</h1>

    <div class="debug-section">
        <h3>Background Script Status</h3>
        <button onclick="testBackgroundScript()">🔧 Test Background Script</button>
        <div id="background-status"></div>
    </div>

    <div class="debug-section">
        <h3>Extension State</h3>
        <button onclick="testExtensionState()">⚙️ Test Extension State</button>
        <div id="extension-state"></div>
    </div>

    <div class="debug-section">
        <h3>Site-Specific State</h3>
        <button onclick="testSiteState()">🌐 Test Site State</button>
        <div id="site-state"></div>
    </div>

    <div class="debug-section">
        <h3>Script Injection</h3>
        <button onclick="testInjection()">💉 Test Injection</button>
        <div id="injection-status"></div>
    </div>

    <div class="debug-section">
        <h3>Data API Tests</h3>
        <button onclick="testDataAPIs()">📊 Test Data APIs</button>
        <div id="data-apis"></div>
    </div>

    <div class="debug-section">
        <h3>Full Debug Log</h3>
        <button onclick="clearLog()">🧹 Clear</button>
        <div id="debug-log"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'log';
            div.style.color = type === 'error' ? 'red' : type === 'success' ? 'green' : type === 'warning' ? 'orange' : '#333';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('debug-log').appendChild(div);
        }

        function setStatus(elementId, content, type = 'info') {
            document.getElementById(elementId).innerHTML = `<div class="status ${type}">${content}</div>`;
        }

        async function testBackgroundScript() {
            log('🔧 Testing background script...');

            try {
                const response = await chrome.runtime.sendMessage({ action: 'ping' });
                if (response) {
                    setStatus('background-status', `✅ Background script responsive<br>Response: ${JSON.stringify(response)}`, 'good');
                    log('Background script ping successful', 'success');
                } else {
                    setStatus('background-status', '❌ Background script not responding (null response)', 'bad');
                    log('Background script returned null', 'error');
                }
            } catch (error) {
                setStatus('background-status', `❌ Background script error: ${error.message}`, 'bad');
                log(`Background script error: ${error.message}`, 'error');
            }
        }

        async function testExtensionState() {
            log('⚙️ Testing extension state...');

            try {
                // Test global extension state
                const globalState = await chrome.runtime.sendMessage({ action: 'GET_EXTENSION_STATE' });
                log(`Global state response: ${JSON.stringify(globalState)}`);

                if (globalState && globalState.success !== false) {
                    setStatus('extension-state',
                        `✅ Global Extension State<br>Enabled: ${globalState.enabled}<br>Full response: <pre>${JSON.stringify(globalState, null, 2)}</pre>`,
                        globalState.enabled ? 'good' : 'warning');
                } else {
                    setStatus('extension-state', `❌ Failed to get global state: ${JSON.stringify(globalState)}`, 'bad');
                }
            } catch (error) {
                setStatus('extension-state', `❌ Extension state error: ${error.message}`, 'bad');
                log(`Extension state error: ${error.message}`, 'error');
            }
        }

        async function testSiteState() {
            log('🌐 Testing site-specific state...');

            try {
                const tabs = await chrome.tabs.query({ active: true, currentWindow: true });
                if (tabs[0]) {
                    const siteState = await chrome.runtime.sendMessage({
                        action: 'GET_SITE_SPECIFIC_STATE',
                        tabId: tabs[0].id
                    });

                    log(`Site state response: ${JSON.stringify(siteState)}`);

                    if (siteState) {
                        setStatus('site-state',
                            `✅ Site-Specific State for ${window.location.hostname}<br>Enabled: ${siteState.enabled}<br>Full response: <pre>${JSON.stringify(siteState, null, 2)}</pre>`,
                            siteState.enabled ? 'good' : 'warning');
                    } else {
                        setStatus('site-state', '❌ No site state response', 'bad');
                    }
                } else {
                    setStatus('site-state', '❌ Could not get current tab', 'bad');
                }
            } catch (error) {
                setStatus('site-state', `❌ Site state error: ${error.message}`, 'bad');
                log(`Site state error: ${error.message}`, 'error');
            }
        }

        async function testInjection() {
            log('💉 Testing script injection...');

            try {
                const injectionResponse = await chrome.runtime.sendMessage({ action: 'INJECT_MAIN_WORLD_SCRIPT' });
                log(`Injection response: ${JSON.stringify(injectionResponse)}`);

                if (injectionResponse && injectionResponse.success) {
                    setStatus('injection-status', '✅ Script injection successful', 'good');

                    // Check if script is actually present
                    setTimeout(() => {
                        if (window._extensionInjected) {
                            setStatus('injection-status', '✅ Script injection successful and main world script detected', 'good');
                        } else {
                            setStatus('injection-status', '⚠️ Script injection reported success but main world script not detected', 'warning');
                        }
                    }, 500);
                } else {
                    setStatus('injection-status', `❌ Script injection failed: ${injectionResponse?.error || 'Unknown error'}`, 'bad');
                }
            } catch (error) {
                setStatus('injection-status', `❌ Injection test error: ${error.message}`, 'bad');
                log(`Injection error: ${error.message}`, 'error');
            }
        }

        async function testDataAPIs() {
            log('📊 Testing data APIs...');

            const results = [];

            // Test network requests API
            try {
                const networkResponse = await chrome.runtime.sendMessage({ action: 'getNetworkRequests', limit: 1 });
                results.push(`Network API: ${networkResponse ? 'Working' : 'Failed'} - ${JSON.stringify(networkResponse)}`);
            } catch (error) {
                results.push(`Network API: Error - ${error.message}`);
            }

            // Test console errors API
            try {
                const consoleResponse = await chrome.runtime.sendMessage({ action: 'getConsoleErrors', limit: 1 });
                results.push(`Console API: ${consoleResponse ? 'Working' : 'Failed'} - ${JSON.stringify(consoleResponse)}`);
            } catch (error) {
                results.push(`Console API: Error - ${error.message}`);
            }

            // Test token events API
            try {
                const tokenResponse = await chrome.runtime.sendMessage({ action: 'getTokenEvents', limit: 1 });
                results.push(`Token API: ${tokenResponse ? 'Working' : 'Failed'} - ${JSON.stringify(tokenResponse)}`);
            } catch (error) {
                results.push(`Token API: Error - ${error.message}`);
            }

            setStatus('data-apis', `<pre>${results.join('\\n')}</pre>`, 'info');
        }

        function clearLog() {
            document.getElementById('debug-log').innerHTML = '';
            log('Debug log cleared');
        }

        // Auto-run basic tests on load
        window.addEventListener('load', async () => {
            log('🟢 Full diagnosis page loaded');
            log(`📍 Current domain: ${window.location.hostname}`);

            await testBackgroundScript();
            await testExtensionState();
            await testSiteState();
        });
    </script>
</body>
</html>
