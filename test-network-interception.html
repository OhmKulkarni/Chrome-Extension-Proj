<!DOCTYPE html>
<html>
<head>
    <title>Network Interception Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-btn { padding: 10px 20px; margin: 10px; background: #007cba; color: white; border: none; cursor: pointer; }
        .console { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Network Interception Test</h1>
    <p>Test the network interception functionality:</p>
    
    <button class="test-btn" onclick="testFetch()">Test Fetch Request</button>
    <button class="test-btn" onclick="testXHR()">Test XHR Request</button>
    <button class="test-btn" onclick="testLargeBody()">Test Large Body</button>
    
    <div id="console" class="console">
        <strong>Test Results:</strong><br>
    </div>

    <script>
        function log(message) {
            document.getElementById('console').innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
        }

        async function testFetch() {
            log('🚀 Testing fetch request...');
            try {
                const response = await fetch('https://httpbin.org/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        test: 'fetch request',
                        timestamp: Date.now(),
                        data: 'A'.repeat(100) // Small body
                    })
                });
                log('✅ Fetch successful: ' + response.status);
            } catch (error) {
                log('❌ Fetch failed: ' + error.message);
            }
        }

        async function testXHR() {
            log('🚀 Testing XHR request...');
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://httpbin.org/post');
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onload = () => log('✅ XHR successful: ' + xhr.status);
            xhr.onerror = () => log('❌ XHR failed');
            xhr.send(JSON.stringify({
                test: 'xhr request',
                timestamp: Date.now(),
                data: 'B'.repeat(200) // Small body
            }));
        }

        async function testLargeBody() {
            log('🚀 Testing large body request...');
            try {
                const largeData = 'C'.repeat(5000); // Large body to test truncation
                const response = await fetch('https://httpbin.org/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        test: 'large body request',
                        timestamp: Date.now(),
                        data: largeData
                    })
                });
                log('✅ Large body fetch successful: ' + response.status + ' (check console for truncation logs)');
            } catch (error) {
                log('❌ Large body fetch failed: ' + error.message);
            }
        }

        // Log when page loads
        window.addEventListener('load', () => {
            log('📄 Page loaded, extension should be intercepting requests');
        });
    </script>
</body>
</html>
