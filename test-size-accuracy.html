<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Accuracy Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .button { background: #007cba; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .results { margin-top: 10px; padding: 10px; background: #f9f9f9; font-family: monospace; white-space: pre-wrap; border: 1px solid #ccc; }
        .accurate { background: #e8f5e8; border-left: 4px solid #2e7d32; }
        .estimated { background: #fff3cd; border-left: 4px solid #f57c00; }
        .missing { background: #ffeaea; border-left: 4px solid #d32f2f; }
    </style>
</head>
<body>
    <h1>🔍 Size Accuracy Debug Test</h1>
    <p>This test checks if accurate size data is reaching the dashboard or if fallback methods are being used.</p>

    <div class="section">
        <h3>1. Check Recent Request Data</h3>
        <button class="button" onclick="checkRequestData()">Analyze Size Data Quality</button>
        <div id="data-results" class="results" style="display: none;"></div>
    </div>

    <div class="section">
        <h3>2. Make Test Request & Track</h3>
        <button class="button" onclick="makeAndTrackRequest()">Make Test Request</button>
        <div id="request-results" class="results" style="display: none;"></div>
    </div>

    <div class="section">
        <h3>3. Size Calculation Simulation</h3>
        <button class="button" onclick="simulateSizeDisplay()">Simulate getSizeDisplay Function</button>
        <div id="simulation-results" class="results" style="display: none;"></div>
    </div>

    <script>
        // Simulate the getSizeDisplay function from NetworkRequestsTable
        function getSizeDisplay(request) {
            // Method 1: Use payload_size if available (most reliable)
            if (request.payload_size && request.payload_size > 0) {
                return { value: `${Math.round(request.payload_size / 1024)}KB`, method: '1-payload_size', accurate: true };
            }
            
            // Method 2: Calculate from separate size fields
            const requestSize = request.requestSize || request.request_size || 0;
            const responseSize = request.responseSize || request.response_size || 0;
            const totalSize = requestSize + responseSize;
            
            if (totalSize > 0) {
                return { value: `${Math.round(totalSize / 1024)}KB`, method: '2-individual_sizes', accurate: true };
            }
            
            // Method 3: Estimate from body content
            let estimatedSize = 0;
            
            const requestBody = request.requestBody || request.request_body;
            if (requestBody) {
                estimatedSize += new Blob([requestBody]).size;
            }
            
            const responseBody = request.responseBody || request.response_body;
            if (responseBody) {
                estimatedSize += new Blob([responseBody]).size;
            }
            
            if (estimatedSize > 0) {
                return { value: `~${Math.round(estimatedSize / 1024)}KB`, method: '3-body_estimation', accurate: false };
            }
            
            // Method 4: Estimate from headers
            if (request.headers) {
                try {
                    const headerStr = typeof request.headers === 'string' ? request.headers : JSON.stringify(request.headers);
                    const headerSize = new Blob([headerStr]).size;
                    if (headerSize > 100) {
                        return { value: `~${Math.round(headerSize / 1024)}KB`, method: '4-header_estimation', accurate: false };
                    }
                } catch (e) {
                    // Ignore
                }
            }
            
            return { value: '-', method: 'none', accurate: false };
        }

        async function checkRequestData() {
            const resultsDiv = document.getElementById('data-results');
            resultsDiv.style.display = 'block';
            resultsDiv.textContent = 'Analyzing recent network requests...\n\n';

            try {
                const response = await chrome.runtime.sendMessage({
                    action: 'getNetworkRequests',
                    limit: 10
                });

                if (response?.success && response.data?.length > 0) {
                    let output = `Found ${response.data.length} recent requests:\n`;
                    output += `${'='.repeat(60)}\n\n`;

                    let accurateCount = 0;
                    let estimatedCount = 0;
                    let missingCount = 0;

                    response.data.forEach((req, i) => {
                        const sizeResult = getSizeDisplay(req);
                        const category = sizeResult.accurate ? 'ACCURATE' : (sizeResult.value === '-' ? 'MISSING' : 'ESTIMATED');
                        
                        if (sizeResult.accurate) accurateCount++;
                        else if (sizeResult.value === '-') missingCount++;
                        else estimatedCount++;

                        output += `${i+1}. ${req.method} ${req.url.substring(0, 40)}...\n`;
                        output += `   Display: ${sizeResult.value} [${category} - Method ${sizeResult.method}]\n`;
                        output += `   Raw Data:\n`;
                        output += `     payload_size: ${req.payload_size} (${typeof req.payload_size})\n`;
                        output += `     request_size: ${req.request_size} (${typeof req.request_size})\n`;
                        output += `     response_size: ${req.response_size} (${typeof req.response_size})\n`;
                        output += `     requestSize: ${req.requestSize} (${typeof req.requestSize})\n`;
                        output += `     responseSize: ${req.responseSize} (${typeof req.responseSize})\n`;
                        output += `     has_request_body: ${!!(req.requestBody || req.request_body)}\n`;
                        output += `     has_response_body: ${!!(req.responseBody || req.response_body)}\n\n`;
                    });

                    output += `\nSUMMARY:\n`;
                    output += `========\n`;
                    output += `✅ Accurate sizes: ${accurateCount} requests\n`;
                    output += `⚠️  Estimated sizes: ${estimatedCount} requests\n`;
                    output += `❌ Missing sizes: ${missingCount} requests\n\n`;

                    if (accurateCount === 0) {
                        output += `🚨 ISSUE: No accurate size data found!\n`;
                        output += `   - Check if main-world script is running\n`;
                        output += `   - Check if size data is being stored in database\n`;
                        resultsDiv.className = 'results missing';
                    } else if (estimatedCount > 0) {
                        output += `⚠️  PARTIAL ISSUE: Some requests using estimated sizes\n`;
                        output += `   - Check body capture settings\n`;
                        output += `   - Verify size field mapping consistency\n`;
                        resultsDiv.className = 'results estimated';
                    } else {
                        output += `🎉 ALL GOOD: All requests have accurate size data!\n`;
                        resultsDiv.className = 'results accurate';
                    }

                    resultsDiv.textContent = output;
                } else {
                    resultsDiv.textContent = 'No network data found or error: ' + (response?.error || 'Unknown error');
                    resultsDiv.className = 'results missing';
                }
            } catch (error) {
                resultsDiv.textContent = 'Error checking request data: ' + error.message;
                resultsDiv.className = 'results missing';
            }
        }

        async function makeAndTrackRequest() {
            const resultsDiv = document.getElementById('request-results');
            resultsDiv.style.display = 'block';
            resultsDiv.textContent = 'Making test request...\n\n';
            resultsDiv.className = 'results';

            try {
                const testData = JSON.stringify({ 
                    test: 'size accuracy', 
                    timestamp: Date.now(),
                    payload: 'x'.repeat(500) // 500 chars for predictable size
                });

                const response = await fetch('https://httpbin.org/post', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Test-Size': 'accuracy-debug'
                    },
                    body: testData
                });

                const responseText = await response.text();
                
                const expectedRequestSize = new Blob([testData]).size;
                const expectedResponseSize = new Blob([responseText]).size;
                const expectedTotal = expectedRequestSize + expectedResponseSize;

                let output = `Test Request Completed:\n`;
                output += `======================\n`;
                output += `URL: https://httpbin.org/post\n`;
                output += `Method: POST\n`;
                output += `Status: ${response.status}\n\n`;
                output += `Expected Sizes (calculated locally):\n`;
                output += `  Request Body: ${expectedRequestSize} bytes\n`;
                output += `  Response Body: ${expectedResponseSize} bytes\n`;
                output += `  Total: ${expectedTotal} bytes (${Math.round(expectedTotal/1024)}KB)\n\n`;

                resultsDiv.textContent = output;

                // Wait 3 seconds then check if it was stored correctly
                setTimeout(async () => {
                    try {
                        const stored = await chrome.runtime.sendMessage({
                            action: 'getNetworkRequests',
                            limit: 3
                        });

                        if (stored?.success && stored.data?.length > 0) {
                            // Find our test request
                            const testReq = stored.data.find(req => 
                                req.url.includes('httpbin.org/post') && 
                                req.method === 'POST' &&
                                (req.request_body || req.requestBody || '').includes('size accuracy')
                            );

                            if (testReq) {
                                const sizeResult = getSizeDisplay(testReq);
                                
                                output += `Stored Request Analysis:\n`;
                                output += `========================\n`;
                                output += `Found test request in database!\n`;
                                output += `  payload_size: ${testReq.payload_size}\n`;
                                output += `  request_size: ${testReq.request_size}\n`;
                                output += `  response_size: ${testReq.response_size}\n`;
                                output += `  Display would show: ${sizeResult.value}\n`;
                                output += `  Method used: ${sizeResult.method}\n`;
                                output += `  Accurate: ${sizeResult.accurate ? 'YES' : 'NO'}\n\n`;

                                if (sizeResult.accurate) {
                                    output += `🎉 SUCCESS: Accurate size data is being stored and would display correctly!\n`;
                                    resultsDiv.className = 'results accurate';
                                } else {
                                    output += `⚠️  ISSUE: Size data is not accurate, using fallback method.\n`;
                                    resultsDiv.className = 'results estimated';
                                }
                            } else {
                                output += `❌ Test request not found in stored data.\n`;
                                output += `   Check if network interception is working.\n`;
                                resultsDiv.className = 'results missing';
                            }
                        } else {
                            output += `❌ No stored requests found.\n`;
                            resultsDiv.className = 'results missing';
                        }

                        resultsDiv.textContent = output;
                    } catch (e) {
                        output += `Error checking stored data: ${e.message}\n`;
                        resultsDiv.textContent = output;
                        resultsDiv.className = 'results missing';
                    }
                }, 3000);

            } catch (error) {
                resultsDiv.textContent = `Test request failed: ${error.message}`;
                resultsDiv.className = 'results missing';
            }
        }

        async function simulateSizeDisplay() {
            const resultsDiv = document.getElementById('simulation-results');
            resultsDiv.style.display = 'block';
            resultsDiv.textContent = 'Simulating getSizeDisplay function with test data...\n\n';

            // Test different scenarios
            const testCases = [
                {
                    name: 'Perfect Data (payload_size)',
                    data: { payload_size: 5120, request_size: 1024, response_size: 4096 }
                },
                {
                    name: 'Individual Sizes (no payload_size)',
                    data: { request_size: 1024, response_size: 4096 }
                },
                {
                    name: 'CamelCase Fields',
                    data: { requestSize: 1024, responseSize: 4096 }
                },
                {
                    name: 'Body Content Only',
                    data: { requestBody: 'x'.repeat(500), responseBody: 'y'.repeat(1500) }
                },
                {
                    name: 'Headers Only',
                    data: { headers: JSON.stringify({request: {'Content-Type': 'application/json'}, response: {'Content-Length': '2048'}}) }
                },
                {
                    name: 'No Size Data',
                    data: { method: 'GET', url: 'https://example.com', status: 200 }
                }
            ];

            let output = '';
            testCases.forEach((testCase, i) => {
                const result = getSizeDisplay(testCase.data);
                output += `${i+1}. ${testCase.name}:\n`;
                output += `   Input: ${JSON.stringify(testCase.data)}\n`;
                output += `   Result: ${result.value}\n`;
                output += `   Method: ${result.method}\n`;
                output += `   Accurate: ${result.accurate ? 'YES' : 'NO'}\n\n`;
            });

            resultsDiv.textContent = output;
            resultsDiv.className = 'results accurate';
        }
    </script>
</body>
</html>
