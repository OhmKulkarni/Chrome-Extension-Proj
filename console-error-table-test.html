<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Error Table Test</title>
</head>
<body>
    <h1>Console Error Table Test</h1>
    <p>This page will generate console errors to test the dashboard error table display.</p>
    
    <button onclick="generateErrors()">Generate Test Errors</button>
    
    <script>
        function generateErrors() {
            // Generate different types of console messages
            console.error("This is a test error message with stack trace");
            console.warn("This is a warning message");
            console.info("This is an info message");
            console.log("This is a log message (should appear as info)");
            
            // Generate error with custom stack
            try {
                throw new Error("Custom error with detailed stack trace");
            } catch (e) {
                console.error("Caught error:", e);
            }
            
            // Generate multiple errors to test table display
            for (let i = 0; i < 5; i++) {
                console.error(`Test error ${i + 1} - This is error number ${i + 1}`);
            }
            
            console.log("Test errors generated! Check the dashboard error table.");
        }
        
        // Auto-generate some errors on page load
        setTimeout(() => {
            console.error("Auto-generated error on page load");
            console.warn("Auto-generated warning on page load");
        }, 1000);
    </script>
</body>
</html>
