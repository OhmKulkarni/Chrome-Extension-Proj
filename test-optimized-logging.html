<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Optimized Logging</title>
</head>
<body>
    <h1>Test Optimized Logging - Yahoo Finance Extension</h1>

    <div id="controls">
        <button onclick="testNetworkRequests()">Test Network Requests</button>
        <button onclick="testConsoleEvents()">Test Console Events</button>
        <button onclick="testBatchingSystem()">Test Batching System</button>
        <button onclick="clearConsole()">Clear Console</button>
    </div>

    <div id="status">
        <h3>Status:</h3>
        <div id="results"></div>
    </div>

    <script>
        function log(message, level = 'info') {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${level.toUpperCase()}: ${message}<br>`;
            results.innerHTML += logEntry;

            // Also log to actual console
            console[level](message);
        }

        function clearConsole() {
            document.getElementById('results').innerHTML = '';
            console.clear();
        }

        async function testNetworkRequests() {
            log('Testing network requests...');

            try {
                // Make some test requests
                const requests = [
                    fetch('/api/test1'),
                    fetch('/api/test2'),
                    fetch('/api/slow-endpoint'), // Simulate slow request
                ];

                // Some will succeed, some will fail (expected)
                await Promise.allSettled(requests);

                log('Network requests completed. Check console for logging - should be minimal!');
            } catch (error) {
                log('Network test error: ' + error.message, 'error');
            }
        }

        async function testConsoleEvents() {
            log('Testing console events...');

            // Test different console levels
            console.log('This is a regular log - should NOT be logged by extension');
            console.info('This is an info message - should NOT be logged by extension');
            console.warn('This is a warning - SHOULD be logged by extension');
            console.error('This is an error - SHOULD be logged by extension');

            log('Console events tested. Check console - only errors/warnings should be logged by extension');
        }

        async function testBatchingSystem() {
            log('Testing batching system with multiple requests...');

            try {
                // Generate multiple network requests quickly
                const promises = [];
                for (let i = 0; i < 8; i++) {
                    promises.push(
                        fetch(`/api/batch-test-${i}`)
                        .catch(() => {}) // Ignore failures
                    );
                }

                // Generate some console events too
                console.warn(`Batch test warning ${Date.now()}`);
                console.error(`Batch test error ${Date.now()}`);
                console.log(`This log should not be captured: ${Date.now()}`);

                await Promise.allSettled(promises);

                log('Batch test completed. Check console - should see batching with minimal logging (only significant batches)');
            } catch (error) {
                log('Batch test error: ' + error.message, 'error');
            }
        }

        // Initialize
        log('Test page loaded. Extension logging should be greatly reduced now.');
        log('Only errors, warnings, and significant batches (5+ items) should be logged.');
        log('Network requests with 400+ status codes will still be logged.');
    </script>
</body>
</html>
