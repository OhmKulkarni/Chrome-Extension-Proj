<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Error Test</title>
</head>
<body>
    <h1>Console Error Test Page</h1>
    <button onclick="generateConsoleError()">Generate Console Error</button>
    <button onclick="navigateAndError()">Navigate & Generate Error</button>
    <button onclick="generateMultipleErrors()">Generate Multiple Errors</button>

    <script>
        let errorCount = 0;

        function generateConsoleError() {
            errorCount++;
            try {
                // This will throw an error
                nonExistentFunction();
            } catch (error) {
                console.error(`Test error #${errorCount}:`, error);
                throw new Error(`Intentional test error #${errorCount}`);
            }
        }

        function navigateAndError() {
            // Simulate navigation that might invalidate extension context
            history.pushState({}, '', '?test=' + Date.now());
            setTimeout(() => {
                generateConsoleError();
            }, 100);
        }

        function generateMultipleErrors() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    generateConsoleError();
                }, i * 1000);
            }
        }

        // Auto-generate some errors on load
        setTimeout(() => {
            console.log('Auto-generating initial console error...');
            generateConsoleError();
        }, 1000);

        // Generate errors over time to test persistence
        setInterval(() => {
            console.log('Generating periodic console error...');
            generateConsoleError();
        }, 5000);
    </script>
</body>
</html>
