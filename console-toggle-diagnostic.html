<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Toggle Diagnostic</title>
</head>
<body>
    <h1>Console Toggle Diagnostic</h1>
    <div id="output"></div>
    <button onclick="runDiagnostic()">Run Diagnostic</button>
    <button onclick="forceRequestSettings()">Force Request Settings</button>
    <button onclick="testConsoleCapture()">Test Console Capture</button>

    <script>
        let output = document.getElementById('output');
        
        function log(message) {
            output.innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }
        
        function runDiagnostic() {
            output.innerHTML = '';
            log('=== Console Toggle Diagnostic ===');
            
            // Check if main-world script is loaded
            log('1. Main world script loaded: ' + (typeof window.__isInterceptingConsole !== 'undefined'));
            log('2. Console interception active: ' + (window.isConsoleIntercepting || 'unknown'));
            log('3. Original console preserved: ' + (typeof window.__originalConsole !== 'undefined'));
            
            // Check if console methods are overridden
            log('4. Console.error overridden: ' + (console.error.toString().includes('callSiteStack') || console.error.toString().includes('interceptConsole')));
            
            // Test communication with content script
            log('5. Testing content script communication...');
            window.dispatchEvent(new CustomEvent('contentScriptRequest', {
                detail: { 
                    action: 'checkConsoleSeverity', 
                    data: { severity: 'error' }, 
                    requestId: 'diag-test-' + Date.now()
                }
            }));
            
            // Listen for response
            let responseReceived = false;
            function responseHandler(event) {
                if (event.detail?.requestId?.startsWith('diag-test-')) {
                    responseReceived = true;
                    log('6. Content script response: ' + JSON.stringify(event.detail.response));
                    window.removeEventListener('contentScriptResponse', responseHandler);
                }
            }
            window.addEventListener('contentScriptResponse', responseHandler);
            
            setTimeout(() => {
                if (!responseReceived) {
                    log('6. Content script response: TIMEOUT - no response received');
                }
            }, 2000);
        }
        
        function forceRequestSettings() {
            log('Forcing settings request...');
            window.dispatchEvent(new CustomEvent('extensionRequestSettings'));
        }
        
        function testConsoleCapture() {
            log('Testing console capture...');
            console.error('TEST: This should be captured if console logging is enabled');
            console.warn('TEST: Warning message');
            console.info('TEST: Info message');
            console.log('TEST: Log message');
        }
        
        // Auto-run diagnostic
        setTimeout(runDiagnostic, 1000);
    </script>
</body>
</html>
