<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Service Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button {
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🔧 Storage Service Test</h1>

    <div class="test-section info">
        <h3>Test Background Script Communication</h3>
        <p>This test verifies that the StorageService can communicate with the background script.</p>
    </div>

    <div class="test-section">
        <h3>Storage Operations Test</h3>
        <button onclick="testGet()">Test GET Operation</button>
        <button onclick="testSet()">Test SET Operation</button>
        <button onclick="testStorageInfo()">Test Storage Info</button>
        <button onclick="testBackgroundConnection()">Test Background Connection</button>
        <pre id="test-results">Click a button to test...</pre>
    </div>

    <script>
        // Mock StorageService for testing (simplified version)
        class TestStorageService {
            constructor(options = {}) {
                this.options = {
                    timeout: 5000,
                    retryAttempts: 3,
                    ...options
                };
            }

            async sendMessage(message) {
                return new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        reject(new Error(`Operation timed out after ${this.options.timeout}ms`));
                    }, this.options.timeout);

                    chrome.runtime.sendMessage(message, (response) => {
                        clearTimeout(timeout);

                        if (chrome.runtime.lastError) {
                            reject(new Error(chrome.runtime.lastError.message));
                            return;
                        }

                        if (!response) {
                            reject(new Error('No response from background script'));
                            return;
                        }

                        if (!response.success) {
                            reject(new Error(response.error || 'Operation failed'));
                            return;
                        }

                        resolve(response.data);
                    });
                });
            }

            async get(keys) {
                return this.sendMessage({
                    action: 'STORAGE_GET',
                    keys: Array.isArray(keys) ? keys : [keys]
                });
            }

            async set(data) {
                await this.sendMessage({
                    action: 'STORAGE_SET',
                    data: data
                });
            }

            async getStorageInfo() {
                return this.sendMessage({
                    action: 'STORAGE_INFO'
                });
            }
        }

        const storageService = new TestStorageService();

        async function testGet() {
            const results = document.getElementById('test-results');
            results.textContent = 'Testing GET operation...\n';
            results.parentElement.className = 'test-section info';

            try {
                const data = await storageService.get(['settings', 'extensionSettings']);

                results.textContent += 'GET operation successful!\n\n';
                results.textContent += 'Retrieved data:\n';
                results.textContent += JSON.stringify(data, null, 2);

                results.parentElement.className = 'test-section success';
            } catch (error) {
                results.textContent += 'GET operation failed!\n';
                results.textContent += 'Error: ' + error.message;
                results.parentElement.className = 'test-section error';
            }
        }

        async function testSet() {
            const results = document.getElementById('test-results');
            results.textContent = 'Testing SET operation...\n';
            results.parentElement.className = 'test-section info';

            try {
                const testData = {
                    testKey: {
                        timestamp: Date.now(),
                        message: 'Test data from storage service test'
                    }
                };

                await storageService.set(testData);

                results.textContent += 'SET operation successful!\n\n';
                results.textContent += 'Set data:\n';
                results.textContent += JSON.stringify(testData, null, 2);

                // Try to read it back
                const readBack = await storageService.get(['testKey']);
                results.textContent += '\n\nRead back data:\n';
                results.textContent += JSON.stringify(readBack, null, 2);

                results.parentElement.className = 'test-section success';
            } catch (error) {
                results.textContent += 'SET operation failed!\n';
                results.textContent += 'Error: ' + error.message;
                results.parentElement.className = 'test-section error';
            }
        }

        async function testStorageInfo() {
            const results = document.getElementById('test-results');
            results.textContent = 'Testing STORAGE_INFO operation...\n';
            results.parentElement.className = 'test-section info';

            try {
                const info = await storageService.getStorageInfo();

                results.textContent += 'STORAGE_INFO operation successful!\n\n';
                results.textContent += 'Storage information:\n';
                results.textContent += JSON.stringify(info, null, 2);

                results.parentElement.className = 'test-section success';
            } catch (error) {
                results.textContent += 'STORAGE_INFO operation failed!\n';
                results.textContent += 'Error: ' + error.message;
                results.parentElement.className = 'test-section error';
            }
        }

        async function testBackgroundConnection() {
            const results = document.getElementById('test-results');
            results.textContent = 'Testing background script connection...\n';
            results.parentElement.className = 'test-section info';

            try {
                // Send a simple ping message
                const response = await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        reject(new Error('Connection timeout'));
                    }, 3000);

                    chrome.runtime.sendMessage({ action: 'ping' }, (response) => {
                        clearTimeout(timeout);

                        if (chrome.runtime.lastError) {
                            reject(new Error(chrome.runtime.lastError.message));
                            return;
                        }

                        resolve(response || 'No response');
                    });
                });

                results.textContent += 'Background script connection successful!\n\n';
                results.textContent += 'Response:\n';
                results.textContent += JSON.stringify(response, null, 2);

                results.parentElement.className = 'test-section success';
            } catch (error) {
                results.textContent += 'Background script connection failed!\n';
                results.textContent += 'Error: ' + error.message + '\n\n';
                results.textContent += 'This might mean:\n';
                results.textContent += '• Background script is not running\n';
                results.textContent += '• Extension is not loaded properly\n';
                results.textContent += '• Message handler is not set up correctly';
                results.parentElement.className = 'test-section error';
            }
        }

        // Initialize test when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Storage Service Test page loaded');

            // Check if we're running in extension context
            if (typeof chrome === 'undefined' || !chrome.runtime) {
                document.getElementById('test-results').textContent = 'Warning: Not running in Chrome extension context. Chrome APIs not available.';
                document.getElementById('test-results').parentElement.className = 'test-section error';
            }
        });
    </script>
</body>
</html>
