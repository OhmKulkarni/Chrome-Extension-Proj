<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Interceptor Test</title>
</head>
<body>
    <h1>Network Request Test</h1>

    <button onclick="testXHR()">Test XMLHttpRequest</button>
    <button onclick="testFetch()">Test Fetch API</button>
    <button onclick="testPOST()">Test POST with body</button>

    <div id="output"></div>

    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }

        function testXHR() {
            log('Testing XMLHttpRequest...');
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://jsonplaceholder.typicode.com/posts/1');
            xhr.onload = function() {
                log('XHR completed: ' + xhr.status + ' - ' + xhr.responseText.substring(0, 100) + '...');
            };
            xhr.send();
        }

        function testFetch() {
            log('Testing Fetch API...');
            fetch('https://jsonplaceholder.typicode.com/posts/1')
                .then(response => response.json())
                .then(data => {
                    log('Fetch completed: ' + JSON.stringify(data).substring(0, 100) + '...');
                })
                .catch(error => log('Fetch error: ' + error));
        }

        function testPOST() {
            log('Testing POST with body...');
            const postData = {
                title: 'Test Post',
                body: 'This is a test post body with some content to measure size',
                userId: 1
            };

            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                body: JSON.stringify(postData),
                headers: {
                    'Content-type': 'application/json; charset=UTF-8',
                    'X-Custom-Header': 'test-value'
                }
            })
            .then(response => response.json())
            .then(data => {
                log('POST completed: ' + JSON.stringify(data).substring(0, 100) + '...');
            })
            .catch(error => log('POST error: ' + error));
        }

        // Listen for extension messages to see what data is being captured
        window.addEventListener('message', function(event) {
            if (event.data.type === 'networkRequest') {
                log('Network request captured: ' + JSON.stringify(event.data.request, null, 2));
            }
        });
    </script>
</body>
</html>
