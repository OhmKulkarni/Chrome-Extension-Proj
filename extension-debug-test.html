<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Communication Test</title>
</head>
<body>
    <h1>Extension Communication Test</h1>
    <p>Open browser console (F12) and check for extension messages</p>

    <button onclick="testConsole()">Test Console Messages</button>
    <button onclick="checkMainWorld()">Check Main-World Script</button>
    <button onclick="checkContentScript()">Check Content Script</button>

    <div id="results"></div>

    <script>
        function log(message) {
            const div = document.getElementById('results');
            div.innerHTML += `<p>${new Date().toLocaleTimeString()}: ${message}</p>`;
            console.log('TEST PAGE:', message);
        }

        function testConsole() {
            log('Testing console interception...');
            console.error('🔴 Test Error from webpage');
            console.warn('🟡 Test Warning from webpage');
            console.info('🔵 Test Info from webpage');
            console.log('⚪ Test Log from webpage');
            log('Console tests sent - check extension dashboard');
        }

        function checkMainWorld() {
            log('Checking main-world script...');

            // Check if main-world script variables exist
            if (typeof window._extensionInjected !== 'undefined') {
                log('✅ Main-world script is injected (_extensionInjected exists)');
            } else {
                log('❌ Main-world script not detected (_extensionInjected missing)');
            }

            // Check for main-world functions
            if (typeof window.isNetworkLoggingEnabled !== 'undefined') {
                log('✅ Main-world networking functions available');
            } else {
                log('❌ Main-world networking functions missing');
            }
        }

        function checkContentScript() {
            log('Checking content script communication...');

            // Try to send a message to background
            if (chrome && chrome.runtime) {
                chrome.runtime.sendMessage({action: 'debugTest'}, (response) => {
                    if (response) {
                        log('✅ Content script communication working: ' + JSON.stringify(response));
                    } else {
                        log('❌ No response from background script');
                    }
                });
            } else {
                log('❌ Chrome runtime API not available');
            }
        }

        // Auto-run checks on load
        window.addEventListener('load', () => {
            log('Page loaded - starting diagnostics...');
            setTimeout(checkMainWorld, 500);
            setTimeout(checkContentScript, 1000);
        });
    </script>
</body>
</html>
