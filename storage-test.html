<!DOCTYPE html>
<html>
<head>
    <title>Extension Storage Test</title>
</head>
<body>
    <h1>Extension Storage Test</h1>
    <button id="checkStorage">Check Extension Storage</button>
    <button id="clearStorage">Clear Extension Storage</button>
    <div id="results"></div>

    <script>
        // This should be run from the extension context (popup, dashboard, etc.)
        document.getElementById('checkStorage').addEventListener('click', async () => {
            try {
                const result = await chrome.storage.local.get(['consoleErrors', 'networkRequests', 'tokenEvents']);
                document.getElementById('results').innerHTML = `
                    <h3>Storage Contents:</h3>
                    <p><strong>Console Errors:</strong> ${(result.consoleErrors || []).length} entries</p>
                    <p><strong>Network Requests:</strong> ${(result.networkRequests || []).length} entries</p>
                    <p><strong>Token Events:</strong> ${(result.tokenEvents || []).length} entries</p>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('results').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });

        document.getElementById('clearStorage').addEventListener('click', async () => {
            try {
                await chrome.storage.local.clear();
                document.getElementById('results').innerHTML = '<p>Storage cleared!</p>';
            } catch (error) {
                document.getElementById('results').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
