<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Overhead Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { margin: 10px; padding: 10px 20px; }
        .test-section { border: 1px solid #ccc; margin: 10px 0; padding: 15px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🔍 Zero Overhead Verification Test</h1>
    
    <div class="test-section">
        <h2>Current State</h2>
        <button onclick="checkCurrentState()">Check Current State</button>
        <div id="currentState" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Console Performance Test</h2>
        <button onclick="testConsolePerformance()">Test Console Performance (10,000 calls)</button>
        <button onclick="disableConsoleAndTest()">Disable Console & Test Performance</button>
        <button onclick="enableConsoleAndTest()">Enable Console & Test Performance</button>
        <div id="consoleResults" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Network Performance Test</h2>
        <button onclick="testNetworkPerformance()">Test Network Performance (100 requests)</button>
        <button onclick="disableNetworkAndTest()">Disable Network & Test Performance</button>
        <button onclick="enableNetworkAndTest()">Enable Network & Test Performance</button>
        <div id="networkResults" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Memory Management Test</h2>
        <button onclick="testMemoryUsage()">Check Memory Usage</button>
        <button onclick="stopAllAndCheckMemory()">Stop All & Check Memory</button>
        <div id="memoryResults" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Zero Overhead Verification</h2>
        <button onclick="verifyZeroOverhead()">🎯 COMPREHENSIVE ZERO OVERHEAD TEST</button>
        <div id="overheadResults" class="result"></div>
    </div>

    <script>
        // Utility function to check if debug interface is available
        function getDebugInterface() {
            return window.__webAppMonitorDebug;
        }

        // Check current state
        function checkCurrentState() {
            const debug = getDebugInterface();
            if (!debug) {
                document.getElementById('currentState').innerHTML = 
                    '<div class="error">❌ Debug interface not available - extension may not be loaded</div>';
                return;
            }

            const state = debug.getInterceptionState();
            document.getElementById('currentState').innerHTML = `
                <div class="success">✅ Extension loaded and accessible</div>
                <strong>Console:</strong> ${state.consoleEnabled ? '🟢 ENABLED' : '🔴 DISABLED'} 
                (Wrapped: ${state.consoleWrapped ? '🟡 YES' : '🟢 NO'})<br>
                <strong>Network:</strong> ${state.networkEnabled ? '🟢 ENABLED' : '🔴 DISABLED'}<br>
                <strong>Any Active:</strong> ${debug.isAnyActive() ? '🟡 YES' : '🟢 NO'}<br>
                <strong>Cache State:</strong> ${JSON.stringify(state.cacheState, null, 2)}
            `;
        }

        // Console performance test
        function testConsolePerformance() {
            const debug = getDebugInterface();
            if (!debug) return;

            const iterations = 10000;
            const start = performance.now();
            
            for (let i = 0; i < iterations; i++) {
                console.log(`Performance test ${i}`);
            }
            
            const end = performance.now();
            const duration = end - start;
            
            document.getElementById('consoleResults').innerHTML = `
                <strong>Console Performance:</strong><br>
                ${iterations} calls in ${duration.toFixed(2)}ms<br>
                Average: ${(duration / iterations).toFixed(4)}ms per call<br>
                <em>Current state: Console ${debug.getInterceptionState().consoleEnabled ? 'ENABLED' : 'DISABLED'}</em>
            `;
        }

        // Disable console and test
        function disableConsoleAndTest() {
            const debug = getDebugInterface();
            if (!debug) return;

            debug.disableConsole();
            setTimeout(() => {
                testConsolePerformance();
                const state = debug.getInterceptionState();
                const resultDiv = document.getElementById('consoleResults');
                resultDiv.innerHTML += `<div class="success">✅ Console disabled - Methods should be unwrapped (Wrapped: ${state.consoleWrapped ? 'YES' : 'NO'})</div>`;
            }, 100);
        }

        // Enable console and test
        function enableConsoleAndTest() {
            const debug = getDebugInterface();
            if (!debug) return;

            debug.enableConsole();
            setTimeout(() => {
                testConsolePerformance();
                const state = debug.getInterceptionState();
                const resultDiv = document.getElementById('consoleResults');
                resultDiv.innerHTML += `<div class="warning">⚠️ Console enabled - Methods should be wrapped (Wrapped: ${state.consoleWrapped ? 'YES' : 'NO'})</div>`;
            }, 100);
        }

        // Network performance test
        function testNetworkPerformance() {
            const debug = getDebugInterface();
            if (!debug) return;

            const requests = 50; // Reduced to avoid overwhelming
            const start = performance.now();
            
            // Use a lightweight endpoint that won't cause CORS issues
            const promises = [];
            for (let i = 0; i < requests; i++) {
                promises.push(fetch('data:text/plain,test'));
            }
            
            Promise.all(promises).then(() => {
                const end = performance.now();
                const duration = end - start;
                
                document.getElementById('networkResults').innerHTML = `
                    <strong>Network Performance:</strong><br>
                    ${requests} requests in ${duration.toFixed(2)}ms<br>
                    Average: ${(duration / requests).toFixed(2)}ms per request<br>
                    <em>Current state: Network ${debug.getInterceptionState().networkEnabled ? 'ENABLED' : 'DISABLED'}</em>
                `;
            });
        }

        // Disable network and test
        function disableNetworkAndTest() {
            const debug = getDebugInterface();
            if (!debug) return;

            debug.disableNetwork();
            setTimeout(() => {
                testNetworkPerformance();
                const resultDiv = document.getElementById('networkResults');
                resultDiv.innerHTML += `<div class="success">✅ Network disabled - Should have zero overhead</div>`;
            }, 100);
        }

        // Enable network and test
        function enableNetworkAndTest() {
            const debug = getDebugInterface();
            if (!debug) return;

            debug.enableNetwork();
            setTimeout(() => {
                testNetworkPerformance();
                const resultDiv = document.getElementById('networkResults');
                resultDiv.innerHTML += `<div class="warning">⚠️ Network enabled - Interception active</div>`;
            }, 100);
        }

        // Memory usage test
        function testMemoryUsage() {
            if (performance.memory) {
                const memory = performance.memory;
                document.getElementById('memoryResults').innerHTML = `
                    <strong>Memory Usage:</strong><br>
                    Used: ${(memory.usedJSHeapSize / 1024 / 1024).toFixed(2)} MB<br>
                    Total: ${(memory.totalJSHeapSize / 1024 / 1024).toFixed(2)} MB<br>
                    Limit: ${(memory.jsHeapSizeLimit / 1024 / 1024).toFixed(2)} MB
                `;
            } else {
                document.getElementById('memoryResults').innerHTML = 
                    '<div class="warning">⚠️ Memory API not available</div>';
            }
        }

        // Stop all and check memory
        function stopAllAndCheckMemory() {
            const debug = getDebugInterface();
            if (!debug) return;

            debug.stopAll();
            setTimeout(() => {
                testMemoryUsage();
                const state = debug.getInterceptionState();
                const resultDiv = document.getElementById('memoryResults');
                resultDiv.innerHTML += `
                    <div class="success">✅ All interception stopped</div>
                    <div>Console wrapped: ${state.consoleWrapped ? 'YES' : 'NO'}</div>
                    <div>Any active: ${debug.isAnyActive() ? 'YES' : 'NO'}</div>
                `;
            }, 100);
        }

        // Comprehensive zero overhead verification
        function verifyZeroOverhead() {
            const debug = getDebugInterface();
            if (!debug) {
                document.getElementById('overheadResults').innerHTML = 
                    '<div class="error">❌ Extension not available</div>';
                return;
            }

            const results = [];
            
            // Test 1: Disable everything
            debug.stopAll();
            
            setTimeout(() => {
                // Test 2: Check state
                const state = debug.getInterceptionState();
                results.push(`✅ Stop All: Console wrapped=${state.consoleWrapped}, Any active=${debug.isAnyActive()}`);
                
                // Test 3: Performance test with everything disabled
                const iterations = 10000;
                const start = performance.now();
                
                for (let i = 0; i < iterations; i++) {
                    console.log(`Zero overhead test ${i}`);
                }
                
                const end = performance.now();
                const disabledTime = end - start;
                results.push(`🎯 Disabled performance: ${disabledTime.toFixed(2)}ms (${(disabledTime/iterations).toFixed(4)}ms per call)`);
                
                // Test 4: Enable console and test again
                debug.enableConsole();
                
                setTimeout(() => {
                    const enabledStart = performance.now();
                    
                    for (let i = 0; i < iterations; i++) {
                        console.log(`Enabled test ${i}`);
                    }
                    
                    const enabledEnd = performance.now();
                    const enabledTime = enabledEnd - enabledStart;
                    const overhead = enabledTime - disabledTime;
                    const overheadPercent = ((overhead / disabledTime) * 100);
                    
                    results.push(`⚠️ Enabled performance: ${enabledTime.toFixed(2)}ms (${(enabledTime/iterations).toFixed(4)}ms per call)`);
                    results.push(`📊 Overhead: ${overhead.toFixed(2)}ms (${overheadPercent.toFixed(1)}% increase)`);
                    
                    // Test 5: Disable again and verify restoration
                    debug.disableConsole();
                    
                    setTimeout(() => {
                        const finalState = debug.getInterceptionState();
                        results.push(`🔄 Re-disabled: Console wrapped=${finalState.consoleWrapped}, Any active=${debug.isAnyActive()}`);
                        
                        // Test 6: Memory check
                        if (performance.memory) {
                            const memory = performance.memory;
                            results.push(`💾 Memory: ${(memory.usedJSHeapSize / 1024 / 1024).toFixed(2)} MB used`);
                        }
                        
                        // Final verdict
                        const isZeroOverhead = !finalState.consoleWrapped && !debug.isAnyActive();
                        const verdictClass = isZeroOverhead ? 'success' : 'error';
                        const verdictIcon = isZeroOverhead ? '✅' : '❌';
                        
                        document.getElementById('overheadResults').innerHTML = `
                            <div class="${verdictClass}">
                                <h3>${verdictIcon} ZERO OVERHEAD VERIFICATION ${isZeroOverhead ? 'PASSED' : 'FAILED'}</h3>
                            </div>
                            ${results.map(r => `<div>${r}</div>`).join('')}
                            <div class="success">
                                <strong>🎯 When disabled: Console methods are ${finalState.consoleWrapped ? 'still wrapped (BAD)' : 'fully restored (GOOD)'}</strong>
                            </div>
                        `;
                    }, 100);
                }, 100);
            }, 100);
        }

        // Auto-check state on load
        window.addEventListener('load', () => {
            setTimeout(checkCurrentState, 1000);
        });
    </script>
</body>
</html>
